name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # typecheck, unit and UI tests, build, then the size budget and source rules (tools/check.js)
      - run: npm run ci

  # Real browsers: Chromium, WebKit (Safari's engine) and a phone viewport. Interaction tests plus axe accessibility checks.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Every PR from this repo gets a preview URL on the staging Worker. It is a version upload, so staging itself is untouched.
  preview:
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build && node tools/check.js
      - name: Upload preview version
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-out.ndjson
        run: npx wrangler versions upload --env staging --preview-alias pr-${{ github.event.number }} --message "PR ${{ github.event.number }} ${{ github.event.pull_request.head.sha }}"
      - name: Comment preview URL
        uses: actions/github-script@v7
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-out.ndjson
        with:
          script: |
            const fs = require('fs');
            const lines = fs.readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, 'utf8').trim().split('\n').map(l => JSON.parse(l));
            const up = lines.filter(l => l.type === 'version-upload').pop();
            const url = up && (up.preview_alias_url || up.preview_url);
            if (!url) { core.warning('No preview URL in wrangler output'); return; }
            const marker = '<!-- drawfree-preview -->';
            const body = `${marker}\nPreview: ${url}\n\nCommit ${context.payload.pull_request.head.sha.slice(0, 7)}`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = comments.find(c => c.body && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
