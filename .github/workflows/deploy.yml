name: Deploy

# Merge to main ships to staging. Production is a manual run (Actions > Deploy > Run workflow, environment: production);
# add required reviewers to the "production" environment in GitHub if you want an approval step.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment || 'staging' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ci
      - name: Deploy
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then npx wrangler deploy; else npx wrangler deploy --env staging; fi
