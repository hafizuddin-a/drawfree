<title>Drawfree</title>
<meta name="description" content="Storyboards you drag, not draw.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
@@CSS@@
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="12" cy="10.5" r="2.6"/><path d="M7.5 20c.6-3 2.3-4.6 4.5-4.6s3.9 1.6 4.5 4.6"/></svg>
      Drawfree
    </div>
    <input class="field pname" id="pname" type="text" maxlength="80" placeholder="Untitled storyboard" aria-label="Project name" autocomplete="off">
    <div class="group bgs" id="bgs" role="group" aria-label="Frame background"></div>
    <div class="group">
      <button class="btn" id="add-char" type="button">+ Character</button>
      <button class="btn" id="shuffle" type="button">Shuffle look</button>
    </div>
    <div class="group">
      <button class="btn" id="undo" type="button" aria-label="Undo" title="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button class="btn" id="redo" type="button" aria-label="Redo" title="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
      <button class="btn" id="reset" type="button">Reset</button>
    </div>
    <div class="group">
      <button class="btn" id="open" type="button" title="Open a .drawfree.json project (Ctrl/Cmd+O)">Open</button>
      <button class="btn" id="save" type="button" title="Save the project as a file (Ctrl/Cmd+S)">Save</button>
      <button class="btn primary" id="export" type="button" title="Download this frame as PNG or SVG">Export</button>
    </div>
    <input id="file" type="file" accept=".json,application/json" hidden>
  </header>

  <aside class="panel" aria-label="Parts">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Search parts" aria-label="Search parts" autocomplete="off">
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="scroll" id="scroll"></div>
  </aside>

  <main class="stagecell">
    <div class="board" id="board">
      <svg id="stage" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Storyboard frame"></svg>
      <div class="overlay" id="overlay"></div>
    </div>
  </main>

  <section class="strip" aria-label="Frames">
    <div class="strip-head">
      <input class="field" id="note" type="text" placeholder="Scene note: action or dialogue for this frame" aria-label="Scene note" autocomplete="off">
      <button class="btn" id="dup-frame" type="button">Duplicate</button>
      <button class="btn" id="del-frame" type="button">Delete</button>
    </div>
    <div class="frames" id="frames"></div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="dropnote" aria-hidden="true">Drop a .drawfree.json file to open it</div>
<div class="modal" id="export-modal" hidden>
  <div class="modal-card narrow" role="dialog" aria-modal="true" aria-labelledby="ex-title">
    <strong id="ex-title">Export <span id="ex-title-n"></span></strong>
    <fieldset class="opts">
      <legend>Format</legend>
      <label><input type="radio" name="ex-fmt" value="png"> PNG</label>
      <label><input type="radio" name="ex-fmt" value="svg"> SVG</label>
    </fieldset>
    <fieldset class="opts" id="ex-scale-set">
      <legend>PNG size</legend>
      <label><input type="radio" name="ex-scale" value="1"> 1x <small>960 × 540</small></label>
      <label><input type="radio" name="ex-scale" value="2"> 2x <small>1920 × 1080</small></label>
      <label><input type="radio" name="ex-scale" value="3"> 3x <small>2880 × 1620</small></label>
    </fieldset>
    <label class="check"><input type="checkbox" id="ex-transp"> Transparent background</label>
    <p class="status" id="ex-status" role="status"></p>
    <div class="actions">
      <button class="btn" id="ex-copy" type="button" hidden>Copy SVG</button>
      <button class="btn" id="ex-close" type="button">Close</button>
      <button class="btn primary" id="ex-go" type="button">Download</button>
    </div>
  </div>
</div>
<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-label="SVG source">
    <strong>Copy blocked by the browser. Select all and copy:</strong>
    <textarea id="modal-text" readonly></textarea>
    <button class="btn primary" id="modal-close" type="button" style="align-self:flex-end">Close</button>
  </div>
</div>

<script>
@@JS@@
</script>
